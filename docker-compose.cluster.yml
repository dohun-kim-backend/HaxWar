version: '3.8'

services:
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6301:6379"
    networks:
      - hexwar-network

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6302:6379"
    networks:
      - hexwar-network

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6303:6379"
    networks:
      - hexwar-network

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6304:6379"
    networks:
      - hexwar-network

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6305:6379"
    networks:
      - hexwar-network

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6306:6379"
    networks:
      - hexwar-network

  # 위 6개 노드가 뜨면 자동으로 클러스터 명령을 실행해 하나로 묶어주는 역할
  redis-cluster-creator:
    image: redis:7-alpine
    container_name: redis-cluster-creator
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    entrypoint: > # 자동 분배를 통하여 마스터 복제본 노드 할당 --cluster-replicas 1 = 복제본을 1개씩 기반 할당
      sh -c "sleep 5 && echo 'yes' | redis-cli --cluster create  redis-node-1:6379 redis-node-2:6379 redis-node-3:6379  redis-node-4:6379 redis-node-5:6379 redis-node-6:6379  --cluster-replicas 1"
    networks:
      - hexwar-network

  # 게임 서버 노드 1
  hexwar-server-1:
    build:
      context: .
      dockerfile: src/HexWar.Server/Dockerfile
    container_name: hexwar-server-1
    depends_on:
      redis-cluster-creator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '256M'
        reservations:
          cpus: '0.5'
          memory: '128M'
    ulimits:
      nofile:
        soft: 20480
        hard: 20480
    sysctls:
      net.core.somaxconn: 65535
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_GCServer=1
      - DOTNET_GCHeapCount=1
      - DOTNET_GCLatencyMode=SustainedLowLatency
      - Redis__ConnectionString=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      - ConnectionStrings__Redis=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      - HEXWAR_NODE_NAME=server-1
      - OTEL_COLLECTOR_ADDR=http://hexwar-otel-collector:4317
      - CORECLR_ENABLE_PROFILING=1
      - CORECLR_PROFILER={918728C2-14F8-4d0b-9611-D6E26B79552C}
      - CORECLR_PROFILER_PATH=/otel/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so
      - DOTNET_STARTUP_HOOKS=/otel/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
      - OTEL_DOTNET_AUTO_HOME=/otel
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://hexwar-otel-collector:4317
      - OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES=HexWar.Diagnostics
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/diagnostics/stats" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hexwar-network

  # 게임 서버 노드 2
  hexwar-server-2:
    build:
      context: .
      dockerfile: src/HexWar.Server/Dockerfile
    container_name: hexwar-server-2
    depends_on:
      redis-cluster-creator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '256M'
        reservations:
          cpus: '0.5'
          memory: '128M'
    ulimits:
      nofile:
        soft: 20480
        hard: 20480
    sysctls:
      net.core.somaxconn: 65535
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_GCServer=1
      - DOTNET_GCHeapCount=1
      - DOTNET_GCLatencyMode=SustainedLowLatency
      - Redis__ConnectionString=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      - ConnectionStrings__Redis=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      - HEXWAR_NODE_NAME=server-2
      - OTEL_COLLECTOR_ADDR=http://hexwar-otel-collector:4317
      - CORECLR_ENABLE_PROFILING=1
      - CORECLR_PROFILER={918728C2-14F8-4d0b-9611-D6E26B79552C}
      - CORECLR_PROFILER_PATH=/otel/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so
      - DOTNET_STARTUP_HOOKS=/otel/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
      - OTEL_DOTNET_AUTO_HOME=/otel
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://hexwar-otel-collector:4317
      - OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES=HexWar.Diagnostics
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/diagnostics/stats" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hexwar-network

  # Nginx 리버스 프록시 및 로드 밸런서
  nginx:
    image: nginx:alpine
    container_name: hexwar-nginx
    ports:
      - "5020:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hexwar-server-1
      - hexwar-server-2
    ulimits:
      nofile:
        soft: 20480
        hard: 20480
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_max_syn_backlog: 8192
      net.ipv4.ip_local_port_range: "1024 65000"
      net.ipv4.tcp_tw_reuse: 1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - hexwar-network

networks:
  hexwar-network:
    driver: bridge
